<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Data Dive Bar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3658"/>
      <stop offset=".55" stop-color="#8b4f68"/>
      <stop offset="1" stop-color="#e98a5e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbc47f"/>
      <stop offset="1" stop-color="#f08a58"/>
    </linearGradient>
    <clipPath id="screen"><rect x="15" y="9" width="34" height="29" rx="3.5"/></clipPath>
    <mask id="stripes">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <rect x="0" y="24.6" width="64" height="1.1" fill="#000"/>
      <rect x="0" y="27.4" width="64" height="1.5" fill="#000"/>
    </mask>
  </defs>
  <!-- Beige compact Mac -->
  <rect x="17" y="55" width="30" height="6" rx="2" fill="#d6c8aa"/>
  <rect x="9" y="3" width="46" height="54" rx="8" fill="#f3ead6"/>
  <rect x="9" y="3" width="46" height="54" rx="8" fill="none" stroke="#0a1826" stroke-opacity=".18"/>
  <!-- Screen: a sunset over the marina -->
  <g clip-path="url(#screen)">
    <rect x="15" y="9" width="34" height="29" fill="url(#sky)"/>
    <circle cx="30" cy="31" r="11.5" fill="url(#sun)" mask="url(#stripes)"/>
    <rect x="15" y="31" width="34" height="7" fill="#17304c"/>
    <rect x="21" y="33.2" width="18" height="1" rx=".5" fill="#f6a56f" opacity=".8"/>
    <rect x="25" y="35.4" width="10" height="1" rx=".5" fill="#6bb8b0" opacity=".7"/>
    <!-- Sailboat silhouette -->
    <path d="M40.4 17.5V30.2M40.4 18.5 34.2 29h6.2ZM41.4 21V29h4.6Z" fill="#10263b" stroke="#10263b" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M33.2 30.2h14l-2 2.2H35.2Z" fill="#10263b"/>
  </g>
  <rect x="15" y="9" width="34" height="29" rx="3.5" fill="none" stroke="#0a1826" stroke-opacity=".35"/>
  <!-- Data badge: three little bars, plus the floppy slot -->
  <rect x="16" y="46" width="2.6" height="4" rx=".6" fill="#6bb8b0"/>
  <rect x="19.8" y="43.5" width="2.6" height="6.5" rx=".6" fill="#e0705a"/>
  <rect x="23.6" y="41.5" width="2.6" height="8.5" rx=".6" fill="#f2945c"/>
  <rect x="35" y="45.5" width="13" height="2.6" rx="1.3" fill="#10263b"/>
</svg>
